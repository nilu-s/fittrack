<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#1a1a1a" />
  <title>FitTrack - Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f0f0f;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }
    .container {
      max-width: 400px;
      padding: 2rem;
    }
    .icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    h1 { font-size: 1.4rem; margin-bottom: 0.5rem; }
    p { color: #888; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📵</div>
    <h1>Du bist offline</h1>
    <p>Deine Daten sind lokal gespeichert. Sobald du wieder online bist, wird alles synchronisiert.</p>
  </div>
</body>
</html>
