# Local-only developer services. It deliberately excludes Caddy, the external
# agent network, public IP bindings, and the host-mounted vision credential.
name: personal-organizer

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      ENVIRONMENT: development
      APP_NAME: ${APP_NAME:-Chronickel}
      APP_PUBLIC_ORIGIN: ${APP_PUBLIC_ORIGIN:-http://localhost:3000}
      DATABASE_URL: postgresql+asyncpg://app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@db:5432/app
      APP_JWT_SECRET: ${APP_JWT_SECRET:?set APP_JWT_SECRET in .env}
      PHOTO_DIR: /app/photos
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        PUBLIC_APP_NAME: ${APP_NAME:-Chronickel}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
