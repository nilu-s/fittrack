services:
  fittrack-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fittrack
      POSTGRES_USER: fittrack
      POSTGRES_PASSWORD: ${FITTRACK_DB_PASSWORD}
      TZ: Europe/Berlin
      PGTZ: Europe/Berlin
    volumes:
      - fittrack_pgdata:/var/lib/postgresql/data
    networks:
      - fittrack-net
    restart: unless-stopped

  fittrack-api:
    build: ./backend
    environment:
      TZ: Europe/Berlin
      DATABASE_URL: postgresql+asyncpg://fittrack:${FITTRACK_DB_PASSWORD}@fittrack-db:5432/fittrack
      OLLAMA_URL: http://ollama:11434
      OLLAMA_VISION_MODEL: moondream:1.8b
      PHOTO_DIR: /app/photos
      JWT_SECRET: ${FITTRACK_JWT_SECRET}
      FITTRACK_JWT_SECRET: ${FITTRACK_JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      ALLOWED_EMAIL: ${ALLOWED_EMAIL}
      FITTRACK_CLI_KEY: ${FITTRACK_CLI_KEY}
    volumes:
      - ./photos:/app/photos
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - fittrack-db
    networks:
      - fittrack-net
      - worldweave_default
      - agent_net
    restart: unless-stopped

  fittrack-web:
    build: ./frontend
    depends_on:
      - fittrack-api
    networks:
      - fittrack-net
      - worldweave_default
    restart: unless-stopped

volumes:
  fittrack_pgdata:

networks:
  fittrack-net:
    driver: bridge
  worldweave_default:
    external: true
  agent_net:
    external: true