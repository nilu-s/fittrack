name: personal-organizer

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD}
      TZ: Europe/Berlin
      PGTZ: Europe/Berlin
    volumes:
      - app_pgdata:/var/lib/postgresql/data
    networks:
      - app-net
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      ENVIRONMENT: production
      TZ: Europe/Berlin
      APP_NAME: ${APP_NAME:-Cronicl}
      APP_PUBLIC_ORIGIN: ${APP_PUBLIC_ORIGIN:?set APP_PUBLIC_ORIGIN in .env}
      DATABASE_URL: postgresql+asyncpg://app:${APP_DB_PASSWORD}@db:5432/app
      VISION_PROXY_URL: http://vision-proxy:8100
      PHOTO_DIR: /app/photos
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      ALLOWED_GOOGLE_EMAILS: ${ALLOWED_GOOGLE_EMAILS}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    volumes:
      - ./photos:/app/photos
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
    networks:
      - app-net
      - agent_net
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        PUBLIC_APP_NAME: ${APP_NAME:-Cronicl}
    depends_on:
      - api
    networks:
      - app-net
    restart: unless-stopped

  vision-proxy:
    build: ./vision-proxy
    environment:
      TZ: Europe/Berlin
      HERMES_AUTH_FILE: /auth/auth.json
    volumes:
      - /root/.hermes/auth.json:/auth/auth.json:ro
    networks:
      - app-net
    restart: unless-stopped

  caddy:
    image: caddy:2.9.1-alpine
    environment:
      APP_CADDY_SITE: ${APP_PUBLIC_ORIGIN:?set APP_PUBLIC_ORIGIN in .env}
      HERMES_PREVIEW_DOMAIN: ${HERMES_PREVIEW_DOMAIN:-preview.49.12.225.84.sslip.io}
    ports:
      - "${APP_BIND_ADDRESS:-49.12.225.84}:${APP_HTTP_PORT:-80}:80"
      - "${APP_BIND_ADDRESS:-49.12.225.84}:${APP_HTTPS_PORT:-443}:443"
      - "${APP_BIND_ADDRESS:-49.12.225.84}:${APP_HTTPS_PORT:-443}:443/udp"
    depends_on:
      - api
      - web
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/hermes/previews:/srv/hermes/previews:ro
      - app_caddy_data:/data
      - app_caddy_config:/config
    networks:
      - app-net
    restart: unless-stopped

volumes:
  app_pgdata:
  app_caddy_data:
  app_caddy_config:

networks:
  app-net:
    driver: bridge
  agent_net:
    external: true
