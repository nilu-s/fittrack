services:
  fittrack-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fittrack
      POSTGRES_USER: fittrack
      POSTGRES_PASSWORD: ${FITTRACK_DB_PASSWORD}
      TZ: Europe/Berlin
      PGTZ: Europe/Berlin
    volumes:
      - fittrack_pgdata:/var/lib/postgresql/data
    networks:
      - fittrack-net
    restart: unless-stopped

  fittrack-api:
    build: ./backend
    environment:
      TZ: Europe/Berlin
      DATABASE_URL: postgresql+asyncpg://fittrack:${FITTRACK_DB_PASSWORD}@fittrack-db:5432/fittrack
      VISION_PROXY_URL: http://vision-proxy:8100
      PHOTO_DIR: /app/photos
      JWT_SECRET: ${FITTRACK_JWT_SECRET}
      FITTRACK_JWT_SECRET: ${FITTRACK_JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      ALLOWED_GOOGLE_EMAILS: ${ALLOWED_GOOGLE_EMAILS}
      LEGACY_OWNER_EMAIL: ${LEGACY_OWNER_EMAIL}
    volumes:
      - ./photos:/app/photos
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - fittrack-db
    networks:
      - fittrack-net
      - agent_net
    restart: unless-stopped

  fittrack-web:
    build: ./frontend
    depends_on:
      - fittrack-api
    networks:
      - fittrack-net
    restart: unless-stopped

  vision-proxy:
    build: ./vision-proxy
    environment:
      TZ: Europe/Berlin
      HERMES_AUTH_FILE: /auth/auth.json
    volumes:
      - /root/.hermes/auth.json:/auth/auth.json:ro
    networks:
      - fittrack-net
    restart: unless-stopped

  caddy:
    image: caddy:2.9.1-alpine
    environment:
      FITTRACK_CADDY_SITE: ${FITTRACK_CADDY_SITE:-https://fittrack.49.12.225.84.sslip.io}
      HERMES_PREVIEW_DOMAIN: ${HERMES_PREVIEW_DOMAIN:-preview.49.12.225.84.sslip.io}
    ports:
      - "${FITTRACK_BIND_ADDRESS:-49.12.225.84}:${FITTRACK_HTTP_PORT:-80}:80"
      - "${FITTRACK_BIND_ADDRESS:-49.12.225.84}:${FITTRACK_HTTPS_PORT:-443}:443"
      - "${FITTRACK_BIND_ADDRESS:-49.12.225.84}:${FITTRACK_HTTPS_PORT:-443}:443/udp"
    depends_on:
      - fittrack-api
      - fittrack-web
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/hermes/previews:/srv/hermes/previews:ro
      - fittrack_caddy_data:/data
      - fittrack_caddy_config:/config
    networks:
      - fittrack-net
    restart: unless-stopped

volumes:
  fittrack_pgdata:
  fittrack_caddy_data:
  fittrack_caddy_config:

networks:
  fittrack-net:
    driver: bridge
  agent_net:
    external: true
