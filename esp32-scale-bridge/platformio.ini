; Cronicl Scale Bridge — ESP32 PlatformIO config
; Reads Renpho BLE scale → posts weight + impedance to the API
;
; Hardware: ESP32 (any variant with BLE + WiFi)
; Scale: Renpho Bluetooth body fat scale (B01N1UX8RW or similar)
;
; Upload: pio run -t upload
; Monitor: pio run -t monitor
; Config: Copy config.h.example → config.h and fill in your values

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<main.cpp>
board_build.partitions = huge_app.csv
lib_deps =
  ArduinoJson@^6.21
  WiFiClientSecure
  h2zero/NimBLE-Arduino@^2.3
build_flags =
  -std=c++17

; First-use firmware for an unknown/new scale protocol.  It scans for the
; ES-CS20M, prints its advertising data and GATT layout, then logs every
; notification/indication.  It deliberately needs neither WiFi nor API keys.
[env:diagnostic]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<diagnostic.cpp>
build_flags =
  -std=c++17
